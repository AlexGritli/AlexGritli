name: generate animated snake

on:
  # Régénère le serpent toutes les 12 h pour suivre tes nouvelles contributions
  schedule:
    - cron: "0 */12 * * *"
  # Permet de le lancer à la main depuis l'onglet Actions
  workflow_dispatch:
  # Se lance aussi à chaque push sur main (donc dès le premier push)
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
